<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NMS Web — Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="browser-bar">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>

  <button class="icon-btn" aria-label="menu" id="burger-toggle-register">
    <span class="hamburger"></span>
  </button>
  <div class="burger-menu" id="burger-menu-register" aria-hidden="true">
    <a href="dashboard.html">Dashboard</a>
    <a href="patients.html">Patients</a>
    <a href="news.html">News</a>
    <a href="reports.html">Reports</a>
  </div>

  <main class="page">
    <h1 class="page-title">Create an account</h1>

    <form class="auth-form" action="dashboard.html" method="get" autocomplete="on" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" placeholder="Enter your full name" required />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="Choose a password" required minlength="8" />
        <div class="error-message" id="password-error" aria-live="polite"></div>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" name="confirm-password" type="password" placeholder="Repeat your password" required minlength="8" />
        <div class="error-message" id="confirm-error" aria-live="polite"></div>
      </div>

      

  <button class="btn-primary" type="submit">Register</button>
    <div class="error-message" id="register-error" aria-live="polite" style="margin-top:8px"></div>

      <p class="auth-helper">Already have an account? <a class="link-btn" href="login.html">Login</a></p>
    </form>

  </main>

  <script src="scripts.js"></script>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="brand">NeuroMind System (NMS)</p>
      <!-- footer navigation moved to top burger menu -->
      <p class="copy">&copy; 2025 NMS Project Team. All rights reserved.</p>
    </div>
  </footer>

  

</body>
</html>
