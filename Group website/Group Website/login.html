<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NMS Web — Login / Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="browser-bar">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>



  <main class="page">
    <h1 class="page-title">Login / Register</h1>

  <form class="auth-form" id="login-form" autocomplete="on" novalidate>
  <!-- name -->
  <div class="field">
    <label for="name">name</label>
    <input id="name" name="name" type="text" placeholder="Enter Name" />
  </div>

  <!-- email -->
  <div class="field">
    <label for="email">email</label>
    <input id="email" name="email" type="email" placeholder="Enter Email" />
  </div>

  <!-- password -->
  <div class="field">
    <label for="password">password</label>
    <input id="password" name="password" type="password" placeholder="Enter Password" />
  </div>

  <button class="btn-primary" type="submit">Login</button>
  <div class="error-message" id="login-error" aria-live="polite" style="margin-top:8px"></div>
  <!-- register prompt -->
  <p class="auth-helper">Don't have an account? <a class="link-btn" href="register.html">Register</a></p>
</form>
  <hr style="margin:24px 0" />
  <section class="admin-login" aria-label="Admin login">
    <h2 style="margin-bottom:6px">Administrator login</h2>
    <p class="muted" style="margin-top:0;margin-bottom:12px">This section is for administrators only. Use your admin account to access user &amp; patient management.</p>
    <form id="admin-login-form" class="auth-form" autocomplete="on" novalidate>
      <div class="field">
        <label for="admin-email">admin email</label>
        <input id="admin-email" name="admin-email" type="email" placeholder="admin@example.com" />
      </div>
      <div class="field">
        <label for="admin-password">password</label>
        <input id="admin-password" name="admin-password" type="password" placeholder="Enter admin password" />
      </div>
      <button class="btn-primary" type="submit">Admin Login</button>
      <div class="admin-error error-message" aria-live="polite" style="margin-top:8px"></div>
    </form>
  </section>

  </main>
  <footer class="site-footer">
  <div class="footer-content">
    <p class="brand">NeuroMind System (NMS)</p>
    <p class="copy">&copy; 2025 NMS Project Team. All rights reserved.</p>
  </div>
</footer>

  <script src="scripts.js"></script>

</body>
</html>
