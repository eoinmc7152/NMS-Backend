<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NMS Web — Patients</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="browser-bar">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <header class="appbar">
    <button class="icon-btn" aria-label="menu" id="burger-toggle-patients" aria-expanded="false">
      <span class="hamburger"></span>
    </button>
    <div class="burger-menu" id="burger-menu-patients" aria-hidden="true">
      <a href="patients.html">Patients</a>
      <a href="news.html">News</a>
      <a href="reports.html">Reports</a>

    </div>

    

    <div class="spacer"></div>



    <button id="add-patient-btn" class="btn-pill primary" type="button">Add Patient <span class="chev">›</span></button>
  </header>

  <main class="page">
    <h1 class="page-title">Patients</h1>
    <p class="page-subtitle">Manage your patients and assessments</p>

    <!-- Add patient form (hidden by default) -->
    <div id="patient-form" class="patient-form" aria-hidden="true" style="display:none;">
      <form id="new-patient-form">
        <div class="field">
          <label for="p-name">Patient name</label>
          <input id="p-name" name="p-name" type="text" placeholder="Full name" required />
        </div>
        <div class="field">
          <label for="p-age">Age</label>
          <input id="p-age" name="p-age" type="number" min="0" placeholder="Age" required />
        </div>
        <div class="field">
          <label for="p-risk">Risk</label>
          <select id="p-risk" name="p-risk">
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>No Risk</option>
          </select>
        </div>
        <div class="field">
          <label for="p-notes">Notes</label>
          <input id="p-notes" name="p-notes" type="text" placeholder="Short notes" />
        </div>
        <div style="display:flex; gap:12px; margin-top:8px;">
          <button class="btn-primary" type="submit">Save Patient</button>
          <button id="cancel-patient" class="btn-primary" type="button" style="background:#9ca3af;">Cancel</button>
        </div>
      </form>
    </div>

    <section class="card">
      <div class="table-band"></div>
      <table class="tracker">
        <thead>
          <tr>
            <th>Patient Name</th>
            <th>Age</th>
            <th>Last Updated</th>
            <th>Risk</th>
            <th>Notes</th>
            <th>View Profile</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patients-tbody">
          <!-- patient rows are rendered from localStorage -->
        </tbody>
      </table>
    </section>
  </main>

  <script>
    (function() {
      const STORAGE_KEY = 'nmsPatients';
      const tbody = document.getElementById('patients-tbody');
      const addBtn = document.getElementById('add-patient-btn');
      const formWrap = document.getElementById('patient-form');
      const newForm = document.getElementById('new-patient-form');
      const cancelBtn = document.getElementById('cancel-patient');

      function formatDate(d) {
        const dt = new Date(d);
        const day = String(dt.getDate()).padStart(2,'0');
        const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const month = monthNames[dt.getMonth()];
        const year = dt.getFullYear();
        return `${day} ${month} ${year}`;
      }

      function loadPatients() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return [];
        try { return JSON.parse(raw); } catch (e) { return []; }
      }

      function savePatients(list) { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }

      function renderPatients(list) {
        tbody.innerHTML = '';
        // determine current user and role
        const currentUserId = localStorage.getItem('nmsCurrentUser');
        let currentUser = null;
        try { const allUsers = JSON.parse(localStorage.getItem('nmsUsers')||'[]'); currentUser = allUsers.find(u=>String(u.id)===String(currentUserId)) || null; } catch(e){ currentUser = null; }

        // if not admin, only show patients owned by the current user
        const visible = (currentUser && currentUser.role === 'admin') ? list : (list || []).filter(p => String(p.ownerId) === String(currentUserId));

        if (!visible || visible.length === 0) {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td colspan="7" style="text-align:center; color:var(--muted);">No patients yet. Click "Add Patient" to create one.</td>`;
          tbody.appendChild(tr);
          return;
        }
        visible.forEach(p => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${p.name}</td>
            <td>${p.age}</td>
            <td><span class="date-pill">${p.lastUpdated}</span></td>
            <td>${p.risk}</td>
            <td>${p.notes || ''}</td>
            <td><a class="btn-chip" href="patient.html?id=${p.id}">Click here</a></td>
            <td><button class="btn-chip remove-btn" data-id="${p.id}" type="button">Remove</button></td>
          `;
          tbody.appendChild(tr);
        });
      }

      let patients = loadPatients();
      renderPatients(patients);

      addBtn.addEventListener('click', () => { formWrap.style.display = ''; formWrap.setAttribute('aria-hidden','false'); formWrap.scrollIntoView({ behavior: 'smooth', block: 'center' }); });
      cancelBtn.addEventListener('click', () => { newForm.reset(); formWrap.style.display = 'none'; formWrap.setAttribute('aria-hidden','true'); });

      newForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const name = document.getElementById('p-name').value.trim();
        const age = document.getElementById('p-age').value.trim();
        const risk = document.getElementById('p-risk').value;
        const notes = document.getElementById('p-notes').value.trim();
        if (!name) return alert('Please enter a name');
        // assign patient to current user
        const currentUserId = localStorage.getItem('nmsCurrentUser');
        if (!currentUserId) return alert('You must be logged in to create a patient.');
        const p = { id: Date.now(), name, age: age || '—', lastUpdated: formatDate(new Date()), risk, notes, ownerId: String(currentUserId) };
        patients.push(p); savePatients(patients); renderPatients(patients); newForm.reset(); formWrap.style.display = 'none'; formWrap.setAttribute('aria-hidden','true');
      });

      tbody.addEventListener('click', (e) => {
        const btn = e.target.closest('.remove-btn'); if (!btn) return;
        const id = btn.getAttribute('data-id');
        const currentUserId = localStorage.getItem('nmsCurrentUser');
        let targetId = id;
        if (!targetId) { const row = btn.closest('tr'); const idx = Array.from(tbody.children).indexOf(row); targetId = patients[idx] && patients[idx].id; }
        if (!targetId) return;
        const target = patients.find(p => String(p.id) === String(targetId));
        if (!target) return;
        // only admin or owner can delete
        let currentUser = null;
        try { const allUsers = JSON.parse(localStorage.getItem('nmsUsers')||'[]'); currentUser = allUsers.find(u=>String(u.id)===String(currentUserId)) || null; } catch(e){ currentUser = null; }
        if (!(currentUser && (currentUser.role === 'admin' || String(target.ownerId) === String(currentUserId)))) { return alert('You do not have permission to remove that patient.'); }
        if (!confirm('Remove patient '+target.name+'?')) return;
        patients = patients.filter(p => String(p.id) !== String(targetId)); savePatients(patients); renderPatients(patients);
      });
    })();

    </script>
  <script src="scripts.js"></script>

  <footer class="site-footer">
    <div class="footer-content">
      <p class="brand">NeuroMind System (NMS)</p>
      <p class="copy">&copy; 2025 NMS Project Team. All rights reserved.</p>
    </div>
  </footer>
</body>
</html>
