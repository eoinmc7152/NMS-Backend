<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NMS — Admin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="browser-bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <header class="appbar">
    <button class="icon-btn" aria-label="menu" id="burger-toggle-admin"><span class="hamburger"></span></button>
    <div class="burger-menu" id="burger-menu-admin" aria-hidden="true">
      <a href="patients.html">Patients</a>
      <a href="reports.html">Reports</a>
      <a href="login.html">Login</a>
    </div>
    <div class="spacer"></div>
  </header>

  <main class="page">
    <h1 class="page-title">Admin Panel</h1>
    <p class="page-subtitle">Manage users and patients</p>

    <section class="card" style="margin-bottom:14px;">
      <div style="padding:12px 16px;">
        <h3 style="margin:0 0 8px">Users</h3>
        <div id="admin-users"></div>
        <div style="margin-top:12px; display:flex; gap:8px; align-items:center;">
          <input id="new-user-email" placeholder="email" style="padding:8px;" />
          <input id="new-user-name" placeholder="full name" style="padding:8px;" />
          <input id="new-user-password" placeholder="password" type="password" style="padding:8px;" />
          <select id="new-user-role"><option value="doctor">Doctor</option><option value="admin">Admin</option></select>
          <button id="create-user" class="btn-primary">Create User</button>
        </div>
        <p class="muted" style="margin-top:8px">Note: created accounts use a generated temporary password which the admin must share with the user.</p>
      </div>
    </section>

    <section class="card">
      <div style="padding:12px 16px;">
        <h3 style="margin:0 0 8px">Patients</h3>
        <div id="admin-patients"></div>
      </div>
    </section>
  </main>

  <script src="scripts.js"></script>
</body>
</html>
