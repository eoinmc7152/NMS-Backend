<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Patient Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button class="icon-btn" aria-label="menu" id="burger-toggle-top">
      <span class="hamburger"></span>
    </button>
    <div class="burger-menu" id="burger-menu-top" aria-hidden="true">
      <a href="patients.html">Patients</a>
      <a href="news.html">News</a>
      <a href="reports.html">Reports</a>
    </div>
    <a href="patients.html">← Back to Patients</a>
  </header>
  <section class="patient-profile">
    <div id="profile-content">
      <form id="profile-form">
        <div class="field">
          <label for="name-input">Name</label>
          <input id="name-input" name="name" type="text" readonly />
        </div>
        <div class="field">
          <label for="age-input">Age</label>
          <input id="age-input" name="age" type="number" min="0" readonly />
        </div>
        <div class="field">
          <label for="risk-input">Risk</label>
          <select id="risk-input" name="risk" disabled>
            <option>Low</option>
            <option>Medium</option>
            <option>High</option>
            <option>No Risk</option>
          </select>
        </div>
        <div class="field">
          <label for="notes-input">Notes</label>
          <textarea id="notes-input" name="notes" rows="3" readonly></textarea>
        </div>

        <div style="display:flex; gap:12px; margin-top:10px;">
          <button id="edit-btn" type="button" class="btn-primary">Edit</button>
          <button id="save-btn" type="button" class="btn-primary" style="display:none;">Save</button>
          <button id="cancel-btn" type="button" class="btn-primary" style="background:#9ca3af; display:none;">Cancel</button>
        </div>
      </form>
    </div>
  <div id="no-data" style="display:none;">Patient not found. <a href="patients.html">Back to patients</a></div>
  </section>
  <script>
    (function(){
      function qs(name) {
        const params = new URLSearchParams(window.location.search);
        return params.get(name);
      }

      const id = qs('id');
      const STORAGE_KEY = 'nmsPatients';
      const profile = document.getElementById('profile-content');
      const noData = document.getElementById('no-data');

      if (!id) {
        profile.style.display = 'none';
        noData.style.display = '';
        return;
      }

      const raw = localStorage.getItem(STORAGE_KEY);
      let patients = [];
      if (raw) patients = JSON.parse(raw);
      const pIndex = patients.findIndex(x => String(x.id) === String(id));
      const p = pIndex > -1 ? patients[pIndex] : null;
      if (!p) {
        profile.style.display = 'none';
        noData.style.display = '';
        return;
      }

      const currentUserId = localStorage.getItem('nmsCurrentUser');
      let currentUser = null;
      try { const allUsers = JSON.parse(localStorage.getItem('nmsUsers')||'[]'); currentUser = allUsers.find(u=>String(u.id)===String(currentUserId)) || null; } catch(e){ currentUser = null; }
      if (!(currentUser && (currentUser.role === 'admin' || String(p.ownerId) === String(currentUserId)))) {
        profile.style.display = 'none';
        noData.style.display = '';
        return;
      }

      // populate form
      const nameInput = document.getElementById('name-input');
      const ageInput = document.getElementById('age-input');
      const riskInput = document.getElementById('risk-input');
      const notesInput = document.getElementById('notes-input');

      nameInput.value = p.name || '';
      ageInput.value = p.age || '';
      riskInput.value = p.risk || 'Low';
      notesInput.value = p.notes || '';

      // controls
      const editBtn = document.getElementById('edit-btn');
      const saveBtn = document.getElementById('save-btn');
      const cancelBtn = document.getElementById('cancel-btn');

      function setEditMode(on) {
        nameInput.readOnly = !on;
        ageInput.readOnly = !on;
        riskInput.disabled = !on;
        notesInput.readOnly = !on;
        editBtn.style.display = on ? 'none' : '';
        saveBtn.style.display = on ? '' : 'none';
        cancelBtn.style.display = on ? '' : 'none';
      }

      editBtn.addEventListener('click', () => setEditMode(true));

      cancelBtn.addEventListener('click', () => {
        // restore values
        nameInput.value = p.name || '';
        ageInput.value = p.age || '';
        riskInput.value = p.risk || 'Low';
        notesInput.value = p.notes || '';
        setEditMode(false);
      });

      saveBtn.addEventListener('click', () => {
        const newName = nameInput.value.trim();
        const newAge = ageInput.value.trim();
        const newRisk = riskInput.value;
        const newNotes = notesInput.value.trim();
        if (!newName) return alert('Name is required');

        // update in-memory and storage
        patients[pIndex] = Object.assign({}, patients[pIndex], {
          name: newName,
          age: newAge || '—',
          risk: newRisk,
          notes: newNotes,
          lastUpdated: (new Date()).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(patients));
        setEditMode(false);
        alert('Patient updated');
      });

      setEditMode(false);
    })();
  </script>
    <script src="scripts.js"></script>
</body>
</html>
